</g><text x="126" y="105" font-size="35" fill="#f3f5f4" font-weight="600" letter-spacing="-1">Colors</text><text x="239" y="104" font-size="23" fill="#a1aaa9" font-weight="400" letter-spacing="1">VPN</text><path d="M64 158H1016" stroke="#30383d"/><circle cx="68" cy="231" r="4" fill="#c4f46c"/><text x="87" y="237" font-size="17" fill="#c4f46c" font-weight="400" font-family="Consolas,monospace" letter-spacing="2.5">НАСТРОЙКА / INCY</text><text x="64" y="319" font-size="67" fill="#f3f5f4" font-weight="500" letter-spacing="-2">Как подключить</text><text x="64" y="394" font-size="67" fill="#c4f46c" font-weight="500" letter-spacing="-2">Colors VPN</text><circle cx="93" cy="458" r="29" fill="#232e1c" stroke="#526b37"/><text x="93" y="466" font-size="24" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">1</text><text x="153" y="453" font-size="36" fill="#f3f5f4" font-weight="500" >Скопируйте ссылку</text><text x="153" y="498" font-size="28" fill="#a1aaa9" font-weight="400" >Из сообщения с доступом.</text><path d="M153 534H1016" stroke="#30383d"/><circle cx="93" cy="600" r="29" fill="#232e1c" stroke="#526b37"/><text x="93" y="608" font-size="24" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">2</text><text x="153" y="595" font-size="36" fill="#f3f5f4" font-weight="500" >Отправьте на нужное устройство</text><text x="153" y="640" font-size="28" fill="#a1aaa9" font-weight="400" >Скопируйте ссылку уже на нём.</text><path d="M153 676H1016" stroke="#30383d"/><circle cx="93" cy="742" r="29" fill="#232e1c" stroke="#526b37"/><text x="93" y="750" font-size="24" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">3</text><text x="153" y="737" font-size="36" fill="#f3f5f4" font-weight="500" >Скачайте и откройте Incy</text><text x="153" y="782" font-size="28" fill="#a1aaa9" font-weight="400" >Ссылки на скачивание — под постом.</text><path d="M153 818H1016" stroke="#30383d"/><circle cx="93" cy="884" r="29" fill="#232e1c" stroke="#526b37"/><text x="93" y="892" font-size="24" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">4</text><text x="153" y="879" font-size="36" fill="#f3f5f4" font-weight="500" >Нажмите «+» справа вверху</text><text x="153" y="924" font-size="28" fill="#a1aaa9" font-weight="400" >В открытом приложении.</text><path d="M153 960H1016" stroke="#30383d"/><circle cx="93" cy="1026" r="29" fill="#232e1c" stroke="#526b37"/><text x="93" y="1034" font-size="24" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">5</text><text x="153" y="1021" font-size="36" fill="#f3f5f4" font-weight="500" >«Вставить из буфера обмена»</text><text x="153" y="1066" font-size="28" fill="#a1aaa9" font-weight="400" >Добавьте подписку и подключитесь.</text><rect x="64" y="1177" width="952" height="63" rx="10" fill="#222d1c" stroke="#3c512b"/><text x="91" y="1218" font-size="30" fill="#c4f46c" font-weight="400" >Одна подписка — три ваших устройства.</text><path d="M64 1245H1016" stroke="#30383d"/><text x="64" y="1293" font-size="16" fill="#a1aaa9" font-weight="400" font-family="Consolas,monospace" letter-spacing="2">ПОДКЛЮЧЕНИЕ В ПЯТЬ ШАГОВ</text><text x="1016" y="1293" font-size="16" fill="#c4f46c" font-weight="400" text-anchor="end" font-family="Consolas,monospace" letter-spacing="2">COLORS VPN</text></g></svg>