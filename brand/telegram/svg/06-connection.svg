</g><text x="158" y="105" font-size="35" fill="#f3f5f4" font-weight="600" letter-spacing="-1">Colors</text><text x="271" y="104" font-size="23" fill="#a1aaa9" font-weight="400" letter-spacing="1">VPN</text><path d="M96 158H1504" stroke="#30383d"/><circle cx="100" cy="220" r="4" fill="#c4f46c"/><text x="119" y="226" font-size="17" fill="#c4f46c" font-weight="400" font-family="Consolas,monospace" letter-spacing="2.5">НАСТРОЙКА / INCY</text><text x="96" y="315" font-size="64" fill="#f3f5f4" font-weight="500" letter-spacing="-2.5">Как подключить Colors VPN</text><circle cx="130" cy="400" r="31" fill="#232e1c" stroke="#526b37"/><text x="130" y="407" font-size="19" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">01</text><text x="196" y="394" font-size="32" fill="#f3f5f4" font-weight="500" >Скопируйте персональную ссылку</text><text x="196" y="435" font-size="24" fill="#a1aaa9" font-weight="400" >Из сообщения с доступом или личного кабинета.</text><path d="M196 467H1504" stroke="#283034"/><circle cx="130" cy="522" r="31" fill="#232e1c" stroke="#526b37"/><text x="130" y="529" font-size="19" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">02</text><text x="196" y="516" font-size="32" fill="#f3f5f4" font-weight="500" >Отправьте её на нужное устройство</text><text x="196" y="557" font-size="24" fill="#a1aaa9" font-weight="400" >Скопируйте её уже на том устройстве, которое подключаете.</text><path d="M196 589H1504" stroke="#283034"/><circle cx="130" cy="644" r="31" fill="#232e1c" stroke="#526b37"/><text x="130" y="651" font-size="19" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">03</text><text x="196" y="638" font-size="32" fill="#f3f5f4" font-weight="500" >Скачайте и откройте Incy</text><text x="196" y="679" font-size="24" fill="#a1aaa9" font-weight="400" >Ссылки для вашей платформы — в тексте поста.</text><path d="M196 711H1504" stroke="#283034"/><circle cx="130" cy="766" r="31" fill="#232e1c" stroke="#526b37"/><text x="130" y="773" font-size="19" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">04</text><text x="196" y="760" font-size="32" fill="#f3f5f4" font-weight="500" >Нажмите «+» справа вверху</text><text x="196" y="801" font-size="24" fill="#a1aaa9" font-weight="400" >В открытом приложении Incy.</text><path d="M196 833H1504" stroke="#283034"/><circle cx="130" cy="888" r="31" fill="#232e1c" stroke="#526b37"/><text x="130" y="895" font-size="19" fill="#c4f46c" font-weight="400" text-anchor="middle" font-family="Consolas,monospace">05</text><text x="196" y="882" font-size="32" fill="#f3f5f4" font-weight="500" >Выберите «Вставить из буфера обмена»</text><text x="196" y="923" font-size="24" fill="#a1aaa9" font-weight="400" >Добавьте подписку и включите подключение.</text><rect x="96" y="1042" width="1408" height="56" rx="10" fill="#222d1c" stroke="#3c512b"/><text x="122" y="1078" font-size="23" fill="#c4f46c" font-weight="400" >Доступ на 3 устройства · App Store / Google Play / другие устройства</text><path d="M96 1095H1504" stroke="#30383d"/><text x="96" y="1143" font-size="16" fill="#a1aaa9" font-weight="400" font-family="Consolas,monospace" letter-spacing="2">ИНТЕРНЕТ В ВАШИХ ЦВЕТАХ</text><text x="1504" y="1143" font-size="16" fill="#c4f46c" font-weight="400" text-anchor="end" font-family="Consolas,monospace" letter-spacing="2">COLORS VPN</text></g></svg>